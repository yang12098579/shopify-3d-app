# =================================================================
# 1. 应用核心标识声明
# =================================================================
client_id = "27a6b6770a4af998e5601b052e0d0b53"
application_url = "https://shopify-3d-app-phi.vercel.app"
embedded = true
name = "Product-3D-Viewer"

# =================================================================
# 2. 读写权限范围 (Access Scopes)
# =================================================================
[access_scopes]
scopes = "read_products,write_products,read_metaobjects,write_metaobjects"

# =================================================================
# 3. 核心元字段预声明 (Metafield Access)
# =================================================================
[product.metafields.custom.product_3d_model]
type = "single_line_text_field"
name = "Product 3D Model URL"
description = "Stores the mapped or AI-generated .glb 3D asset link"

  [product.metafields.custom.product_3d_model.access]
  admin = "merchant_read_write"

# =================================================================
# 4. Webhook 事件订阅 & GDPR 隐私合规 (同步至 Vercel 线上)
# =================================================================
[webhooks]
api_version = "2026-07"

  # 🛡️ Shopify 官方强制要求的 GDPR 隐私路由专属声明模块
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks"
  customer_deletion_url = "/webhooks"
  shop_deletion_url = "/webhooks"

  # 🚨 修复：统一使用 /webhooks 入口，配合代码里的 switch (topic) 逻辑
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/scopes_update" ]

# =================================================================
# 5. 路由鉴权与构建行为
# =================================================================
[auth]
redirect_urls = [ "https://shopify-3d-app-phi.vercel.app/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

# =================================================================
# 6. 原生导航菜单
# =================================================================
[navigation]
view_history = true

  [[navigation.left_menu]]
  label = "首页仪表盘"
  pathname = "/app"

  [[navigation.left_menu]]
  label = "3D 模型管理"
  pathname = "/app/additional"

# =================================================================
# 7. 应用代理配置 (打通 C 端买家真实数据收集隧道)
# =================================================================
[app_proxy]
url = "https://shopify-3d-app-phi.vercel.app/api"
subpath = "api"
prefix = "apps"