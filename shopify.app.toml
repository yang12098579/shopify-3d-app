# =================================================================
# 1. 应用核心标识声明 (已同步你的新域名)
# =================================================================
client_id = "27a6b6770a4af998e5601b052e0d0b53"
application_url = "https://vision3d-app.vercel.app"
embedded = true
name = "Product-3D-Viewer"

# =================================================================
# 2. 读写权限范围 (Access Scopes)
# =================================================================
[access_scopes]
scopes = "read_products,write_products,read_metaobjects,write_metaobjects"

# =================================================================
# 3. 核心元字段预声明 (Metafield Access)
# =================================================================
[product.metafields.custom.product_3d_model]
type = "single_line_text_field"
name = "Product 3D Model URL"
description = "Stores the mapped or AI-generated .glb 3D asset link"

  [product.metafields.custom.product_3d_model.access]
  admin = "merchant_read_write"

# =================================================================
# 4. Webhook 事件订阅 & GDPR 隐私合规 (🔥 终极修复：使用绝对路径击碎缓存)
# =================================================================
[webhooks]
api_version = "2026-07"

  # 🛡️ GDPR 隐私路由：这里已经全部改成带新域名的【绝对路径】，强行洗掉 Shopify 的旧域名记忆！
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://vision3d-app.vercel.app/webhooks"
  customer_deletion_url = "https://vision3d-app.vercel.app/webhooks"
  shop_deletion_url = "https://vision3d-app.vercel.app/webhooks"

  # 🔧 普通订阅路由也统一改好
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app_subscriptions/update" ]

# =================================================================
# 5. 路由鉴权与构建行为 (已同步新域名的 Remix 授权回调)
# =================================================================
[auth]
redirect_urls = [ 
  "https://vision3d-app.vercel.app/auth/callback",
  "https://vision3d-app.vercel.app/auth/shopify/callback",
  "https://vision3d-app.vercel.app/api/auth" 
]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

# =================================================================
# 6. 原生导航菜单
# =================================================================
[navigation]
view_history = true

  [[navigation.left_menu]]
  label = "首页仪表盘"
  pathname = "/app"

  [[navigation.left_menu]]
  label = "3D 模型管理"
  pathname = "/app/additional"

# =================================================================
# 7. 应用代理配置 (已同步你的新域名)
# =================================================================
[app_proxy]
url = "https://vision3d-app.vercel.app/api"
subpath = "api"
prefix = "apps"